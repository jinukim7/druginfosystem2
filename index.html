<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>약품정보 안내 챗봇</title>
<style>
  :root {
    --primary: #2f80ed;
    --primary-dark: #1c60c4;
    --bg: #f4f6fb;
    --bot-bubble: #ffffff;
    --user-bubble: #2f80ed;
    --border: #e2e8f0;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg);
  }
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    padding: 18px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    z-index: 2;
  }
  header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  header p { margin: 6px 0 0; font-size: 13px; opacity: 0.9; }
  .disclaimer {
    background: #fff7ed;
    color: #9a3412;
    font-size: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid #fed7aa;
    text-align: center;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; gap: 10px; max-width: 90%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .msg.bot .avatar { background: #e0edff; }
  .msg.user .avatar { background: var(--user-bubble); color: #fff; }
  .bubble {
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-top-right-radius: 4px;
  }
  .bubble h3 { margin: 4px 0 6px; font-size: 15.5px; color: var(--primary-dark); }
  .bubble h4 { margin: 10px 0 4px; font-size: 14px; }
  .bubble ul { margin: 4px 0; padding-left: 18px; }
  .bubble li { margin: 2px 0; }
  .quick {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px 0;
  }
  .quick button {
    border: 1px solid var(--primary);
    background: #fff;
    color: var(--primary);
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.15s;
  }
  .quick button:hover { background: var(--primary); color: #fff; }
  .composer {
    display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid var(--border); background: #fff;
  }
  .composer input {
    flex: 1; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 22px; font-size: 14px; outline: none;
  }
  .composer input:focus { border-color: var(--primary); }
  .composer button {
    background: var(--primary); color: #fff; border: none;
    border-radius: 22px; padding: 0 20px; font-size: 14px; cursor: pointer;
  }
  .composer button:hover { background: var(--primary-dark); }
  .typing span {
    display: inline-block; width: 7px; height: 7px; margin: 0 1px;
    background: var(--muted); border-radius: 50%; animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2;} 40%{opacity:1;} }
  footer { text-align: center; font-size: 11px; color: var(--muted); padding: 6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>💊 약품정보 안내 챗봇</h1>
    <p>의약품의 효능·복용법·부작용·주의사항 등을 안내해 드립니다.</p>
  </header>
  <div class="disclaimer">
    ⚠️ 본 정보는 참고용입니다. 복용 결정은 반드시 의사 또는 약사와 상담하세요.
  </div>
  <div class="chat" id="chat"></div>
  <div class="quick" id="quick">
    <button data-q="타이레놀">타이레놀</button>
    <button data-q="게보린">게보린</button>
    <button data-q="판콜에이">판콜에이</button>
    <button data-q="후시딘">후시딘</button>
  </div>
  <div class="composer">
    <input id="input" type="text" placeholder="약품명을 입력하세요 (예: 타이레놀)" autocomplete="off" />
    <button id="send">전송</button>
  </div>
  <footer>© 2025 druginfosystem2 · 데이터 출처: 식품의약품안전처(공공데이터포털)</footer>
</div>

<script>
const API_URL = "https://apis.data.go.kr/1471000/DrbEasyDrugInfoService/getDrbEasyDrugList";
// 공공데이터포털 서비스키 (Encoding)
const SERVICE_KEY = "veMBnJsL8jWpLEY7E4wJdxFO5pYfz8jV38JkwdzghcC+5pSGaUR0dDUMgvEhvy01KfP49u512tHVP7I8rOjbUw==";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

const EMERGENCY_WORDS = ["호흡곤란","의식","알레르기 쇼크","과다복용","흉통","경련","자살","자해"];

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function addMessage(role, htmlContent) {
  const msg = el("div", "msg " + role);
  const avatar = el("div", "avatar", role === "bot" ? "💊" : "🙂");
  const bubble = el("div", "bubble", htmlContent);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function showTyping() {
  const msg = el("div", "msg bot");
  msg.id = "typing";
  const avatar = el("div", "avatar", "💊");
  const bubble = el("div", "bubble", '<span class="typing"><span></span><span></span><span></span></span>');
  msg.appendChild(avatar); msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

function esc(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function toList(text) {
  if (!text) return "<li>정보가 제공되지 않았습니다.</li>";
  return text.split(/\n+/).filter(l => l.trim())
    .map(l => "<li>" + esc(l.trim()) + "</li>").join("");
}

function renderDrug(item) {
  return `
    <h3>${esc(item.itemName)}</h3>
    <div style="font-size:12.5px;color:#6b7280;margin-bottom:6px;">제조/수입: ${esc(item.entpName || "-")}</div>
    <h4>💡 효능·효과</h4><ul>${toList(item.efcyQesitm)}</ul>
    <h4>🥄 복용방법</h4><ul>${toList(item.useMethodQesitm)}</ul>
    <h4>⚠️ 주의사항</h4><ul>${toList(item.atpnQesitm)}</ul>
    <h4>🚫 주요 부작용</h4><ul>${toList(item.seQesitm)}</ul>
    <h4>🔄 상호작용</h4><ul>${toList(item.intrcQesitm)}</ul>
    <h4>📦 보관방법</h4><ul>${toList(item.depositMethodQesitm)}</ul>
    <div style="margin-top:8px;font-size:12.5px;color:#6b7280;">
      ※ 개인의 건강 상태에 따라 다를 수 있으므로 담당 의사 또는 약사와 상담하시기 바랍니다.
    </div>`;
}

function checkEmergency(text) {
  return EMERGENCY_WORDS.some(w => text.includes(w));
}

async function queryDrug(name) {
  const url = `${API_URL}?serviceKey=${encodeURIComponent(SERVICE_KEY)}&itemName=${encodeURIComponent(name)}&type=json&numOfRows=3&pageNo=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const items = data?.body?.items;
  if (!items || items.length === 0) return null;
  return Array.isArray(items) ? items : [items];
}

async function handleInput(text) {
  text = text.trim();
  if (!text) return;
  addMessage("user", esc(text));

  if (checkEmergency(text)) {
    addMessage("bot", "🚨 <strong>설명해 주신 내용은 응급상황일 수 있습니다.</strong><br>즉시 <strong>119</strong> 또는 가까운 응급실에 연락하거나 방문하시기 바랍니다.");
    return;
  }

  showTyping();
  try {
    const items = await queryDrug(text);
    hideTyping();
    if (!items) {
      addMessage("bot", `<strong>"${esc(text)}"</strong> 에 대한 의약품 정보를 찾지 못했습니다.<br>정확한 제품명을 입력하시거나, 다른 이름으로 다시 시도해 주세요. 궁금한 점은 약사에게 문의하시는 것도 좋습니다.`);
      return;
    }
    items.forEach(renderAndAdd);
  } catch (e) {
    hideTyping();
    addMessage("bot", `죄송합니다. 정보를 불러오는 중 오류가 발생했습니다.<br><span style="font-size:12px;color:#6b7280;">(${esc(e.message)}) — 브라우저 보안(CORS) 제한이 원인일 수 있습니다. 잠시 후 다시 시도해 주세요.</span>`);
  }
}
function renderAndAdd(item) { addMessage("bot", renderDrug(item)); }

sendBtn.addEventListener("click", () => { const v = input.value; input.value=""; handleInput(v); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter") { const v = input.value; input.value=""; handleInput(v); } });
document.getElementById("quick").addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") handleInput(e.target.dataset.q);
});

// 첫 인사말
addMessage("bot", "안녕하세요! 저는 <strong>약품정보 안내 챗봇</strong>입니다. 💊<br>궁금한 <strong>약품명</strong>을 입력해 주세요. 효능·효과, 복용방법, 주의사항, 부작용, 상호작용, 보관방법을 안내해 드립니다.<br><br>예: <em>타이레놀, 게보린, 판콜에이</em>");
</script>
</body>
</html>
